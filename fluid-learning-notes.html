<script>MD="# \u6d41\u4f53\u7b97\u6cd5\u5b66\u4e60\u8bb0\u5f55\uff08FluidNinja / Niagara Grid 2D / Stable Fluids\uff09\n\n> 2026-08-22 \u7684\u5b8c\u6574\u5b66\u4e60\u5bf9\u8bdd\u6574\u7406\u3002\u914d\u5957\u4ea4\u4e92\u6559\u5b66\u9875\uff1a[fluidninja-fluid-tutorial.html](./fluidninja-fluid-tutorial.html)\uff08\u540c\u76ee\u5f55\uff0c\u53cc\u51fb\u6d4f\u89c8\u5668\u6253\u5f00\uff09\n> Obsidian \u7b14\u8bb0\uff1a`D:\\Note\\Obsidian\\001_\u7b14\u8bb0\u5e93\\UE\\000_\u57fa\u7840\u77e5\u8bc6\u70b9\\Niagara\\\u6d41\u4f53\u6a21\u62df\u4e0e Niagara Curl Noise \u7b97\u6cd5\u7b14\u8bb0.md`\n\n---\n\n## \u4e00\u3001\u603b\u7eb2\uff1a\u6d41\u4f53\u4e0d\u662f\u4e1c\u897f\uff0c\u662f\u573a\n\n> **\u4e0d\u8ffd\u8e2a\u6bcf\u4e00\u6ef4\u6c34\uff0c\u800c\u662f\u628a\u7a7a\u95f4\u5207\u6210\u7f51\u683c\uff0c\u6bcf\u4e2a\u683c\u5b50\u8bb0\u5f55\u4e00\u7f15\"\u98ce\"\uff08\u901f\u5ea6\u5411\u91cf\uff09\uff0c\u8ba9\u56fa\u5b9a\u6d41\u6c34\u7ebf\u6bcf\u5e27\u8f6e\u6d41\u4e0a\u573a\u3002**\n\n- **\u7c92\u5b50\u6cd5\uff08\u62c9\u683c\u6717\u65e5\uff09**\uff1a\u8ddf\u7740\u6bcf\u6ef4\u6c34\u65c5\u884c\uff08\u70b9\u5728\u52a8\uff09\u3002Niagara \u666e\u901a\u53d1\u5c04\u5668\u5c5e\u4e8e\u8fd9\u7c7b\u3002\n- **\u7f51\u683c\u6cd5\uff08\u6b27\u62c9\uff09**\uff1a\u7ad9\u5728\u6bcf\u4e2a\u683c\u5b50\u770b\u5929\u6c14\uff08\u683c\u5b50\u4e0d\u52a8\uff0c\u8bfb\u6570\u5728\u53d8\uff09\u3002FluidNinja / Niagara Grid 2D \u5c5e\u4e8e\u8fd9\u7c7b\u3002\n- \u6d41\u4f53\u7684\u5168\u90e8\u72b6\u6001 = **\u4e24\u5f20\u8868\uff08\u573a\uff09**\uff1a\u901f\u5ea6\u573a\uff08\u6bcf\u683c\u4e00\u4e2a\u7bad\u5934\uff09+ \u67d3\u6599\u573a\uff08\u6bcf\u683c\u591a\u5c11\u58a8\uff09\u3002\n- \u683c\u5b50\u50cf LED \u5927\u5c4f\u7684\u50cf\u7d20\uff1a**\u710a\u6b7b\u4e0d\u52a8\uff0c\u4eae\u5ea6\u548c\u989c\u8272\uff08\u6570\u503c\uff09\u5728\u53d8**\u2014\u2014\"\u6d41\u52a8\"\u662f\u6570\u503c\u5206\u5e03\u7684\u632a\u4f4d\uff08\u4eba\u6d6a\uff09\uff0c\u6ca1\u6709\u4efb\u4f55\u4e1c\u897f\u771f\u7684\u5728\u79fb\u52a8\u3002\n- \u5224\u65ad Niagara \u5f62\u6001\uff1a\u6570\u636e\u5728 Particles \u91cc = \u7c92\u5b50\u6cd5\uff1b\u6570\u636e\u5728 Render Target / Grid Collection \u91cc = \u7f51\u683c\u6cd5\u3002\n\n**\u6838\u5fc3\u5faa\u73af\uff1a\u901f\u5ea6\u573a\u642c\u8fd0\u67d3\u6599\uff0c\u7269\u7406\u89c4\u5f8b\u4fee\u6b63\u901f\u5ea6\u573a\u3002**\n\n---\n\n## \u4e8c\u3001\u4e00\u5e27\u6d41\u6c34\u7ebf\uff08\u4e09\u6b65 + \u8c03\u5473\uff09\n\n```\n\u2460 \u6ce8\u5165 \u2192 \u2461 \u914d\u5e73 \u2192 \u2462 \u5e73\u6d41\uff08\u642c\u8fd0\uff09\u2192 \u4e0b\u4e00\u5e27\u2026\u2026\uff08\u6bcf\u79d2 60 \u5708\uff09\n```\n\n### \u2460 \u6ce8\u5165\uff08\u5916\u529b\u70b9\u706b\uff09\n\n\u5728\u67d0\u70b9\u6ce8\u5165\u901f\u5ea6\uff0c**\u5168\u573a\u6bcf\u4e2a\u683c\u5b50\u72ec\u7acb\u8ba1\u7b97**\"\u6211\u79bb\u6ce8\u5165\u70b9\u591a\u8fdc \u2192 \u6309\u9ad8\u65af\u6298\u6263\u5206\u5230\u591a\u5c11\u529b \u2192 \u52a0\u8fdb\u81ea\u5df1\"\u3002\n\n\u4e24\u4e2a\u65cb\u94ae\uff1a\n- **\u529b\u5ea6**\uff1a\u8fd9\u6b21\u5212\u6c34\u591a\u5927\u52b2\uff08\u4e58\u5728\u6700\u524d\u9762\uff0c\u5168\u4f53\u6309\u6bd4\u4f8b\uff09\n- **\u534a\u5f84**\uff1a\u6298\u6263\u8868\u591a\u6177\u6168\uff08\u534a\u5f84\u5c0f=\u9488\u523a\uff0c\u5927=\u8239\u6868\u5212\u6c34\uff09\n\n\u624b\u7b97\u4f8b\uff083 \u683c A/B/C\uff0c\u6ce8\u5165\u5411\u53f3\u529b\u5ea6 2\uff0c\u6298\u6263 100%/10%/10%\uff09\uff1a\n```\n\u6ce8\u5165\u540e\u901f\u5ea6\uff1aA 0.2 \u2192   B 2.0 \u2192   C 0.2 \u2192\n```\n\u58a8\u540c\u7406\uff1aB \u5f97 1.0\uff0cA/C \u5404 0.1\u3002\n\n\u8981\u70b9\uff1a\n- \u683c\u5b50\u4e4b\u95f4**\u4ece\u4e0d\u901a\u4fe1**\uff0c\u5404\u7b97\u5404\u7684\uff08GPU \u5e76\u884c\uff09\n- \u6ce8\u5165\u70b9\u5f71\u54cd\u7684\u662f**\u573a**\uff0c\u4e0d\u662f\u76f4\u63a5\u63a8\u522b\u7684\u70b9\u2014\u2014\u4e00\u5207\u5f71\u54cd\u7ecf\u573a\u4e2d\u8f6c\uff08\u70b9\u2192\u573a\u2192\u70b9\uff0c\u6ca1\u6709\u70b9\u5bf9\u70b9\u76f4\u8fde\uff09\n- \u4f60\u7684\u8f93\u5165\u53ea\u662f\"\u613f\u671b\"\uff0c\u914d\u5e73\u628a\u5b83\u4fee\u6b63\u6210\"\u7269\u7406\u5141\u8bb8\u7684\u4e8b\"\n\n### \u2461 \u914d\u5e73\uff08\u538b\u529b\u6295\u5f71\uff09\u2014\u2014\u7b97\u6cd5\u7684\u5fc3\u810f\n\n**\u67e5\u8d26\uff08\u5dee\u5f02/\u6563\u5ea6\uff09**\uff1a\u6c34\u4e0d\u53ef\u538b\u7f29 \u2192 \u6bcf\u683c\"\u6d41\u5165 = \u6d41\u51fa\"\u3002\u76ef\"\u683c\u5b50\u4e4b\u95f4\u7684\u95e8\"\uff1a\n\n\u624b\u7b97\u4f8b\uff08\u5ef6\u7eed\u4e0a\u9762\uff09\uff1a\n| \u683c\u5b50 | \u6536\u8fdb | \u9001\u51fa | \u8d26 |\n| --- | --- | --- | --- |\n| A | 0\uff08\u5de6\u5899\uff09 | 0.2 | \u4e8f 0.2 |\n| B | 0.2 | 2.0 | **\u4e8f 1.8** |\n| C | 2.0 | 0\uff08\u53f3\u5899\uff09 | **\u76c8 2.0** |\n\n\u4e8f\u7a7a=\u6c34\u51ed\u7a7a\u6d88\u5931\u3001\u66b4\u6da8=\u51ed\u7a7a\u53d8\u591a\u2014\u2014\u7269\u7406\u4e0d\u5141\u8bb8\uff0c\u5fc5\u987b\u4fee\u3002\n\n**\u4fee\u6cd5\uff08\u538b\u529b\u8fed\u4ee3 / Jacobi\uff09**\uff1a\u4e00\u6761\u8822\u89c4\u5219\u5237 20~40 \u904d\uff1a\n```\np[\u81ea\u5df1] = (p\u5de6 + p\u53f3 + p\u4e0a + p\u4e0b \u2212 div) / 4\n```\n- \"\u6211 = \u90bb\u5c45\u5e73\u5747 \u2212 \u6211\u7684\u8d26\"\n- **\u6ca1\u6709\u603b\u6307\u6325**\uff1a\u6bcf\u4e2a\u683c\u5b50\u53ea\u770b\u90bb\u5c45\u5fae\u8c03\u81ea\u5df1\uff08\u50cf\u5168\u73ed\u6392\u961f\uff0c\u6bcf\u4eba\u53ea\u770b\u5de6\u53f3\u90bb\u5c45\uff0c\u51e0\u5341\u8f6e\u540e\u5168\u573a\u81ea\u52a8\u6392\u9f50\u2014\u2014\u79e9\u5e8f\u4ece\u5c40\u90e8\u89c4\u5219\u6d8c\u73b0\uff09\n- \u4e00\u8f6e\u914d\u4e0d\u5e73\uff08\u7275\u4e00\u53d1\u52a8\u5168\u8eab\uff09\uff0c\u6240\u4ee5\u8fed\u4ee3\uff1b\u6e38\u620f\u6562\u53ea\u5237 20~40 \u6b21\uff08\"\u51e0\u4e4e\u5e73\"\u89c6\u89c9\u4e0a\u5df2\u662f\u6c34\uff09\n- **\u70ed\u542f\u52a8**\uff1a\u4e0a\u4e00\u5e27\u538b\u529b\u7559 80% \u5f53\u8d77\u70b9\uff08\u8d8b\u52bf\u6709\u60ef\u6027\uff0c\u6536\u655b\u5feb\uff09\n\n**\u6267\u884c\uff08\u68af\u5ea6\u51cf\u9664\uff09**\uff1a`u = u \u2212 \u2207p`\uff08\u9006\u7740\u538b\u529b\u5dee\u4fee\u901f\u5ea6\uff09\u3002\u4fee\u6b63\u540e\u6563\u5ea6=0 \u2713\u3002\n\n\u624b\u7b97\u4f8b\u4fee\u6b63\u7ed3\u679c\uff08\u793a\u610f\uff09\uff1aB 2.0 \u2192 1.3\uff0cA/C 0.2 \u2192 0.55\uff08B \u591a\u4f59\u7684\u901f\u5ea6\u88ab\u5206\u8fd8\u7ed9\u4e24\u8fb9\u2014\u2014\u4f60\u6ce8\u5165\u7684\u662f\u51b2\u52b2\uff0c\u6c34\u8868\u73b0\u51fa\u7684\u662f\u88ab\u644a\u5300\u7684\u5408\u6cd5\u72b6\u6001\uff09\u3002\n\n### \u2462 \u5e73\u6d41\uff08\u534a\u62c9\u683c\u6717\u65e5 \u00b7 \u60ef\u6027\u642c\u8fd0\uff09\n\n> **\u5e73\u6d41 = \u58a8\u88ab\u98ce\u5e26\u7740\u6655\u5f00\u2014\u2014\u50cf\u4e00\u6ef4\u58a8\u6ef4\u8fdb\u6c34\u91cc\uff0c\u4e91\u96fe\u4e00\u6837\u6162\u6162\u6563\u51fa\u53bb\u3002**\n\n\u7b97\u6cd5\u7684\u95ee\u6cd5\u662f\u53cd\u7684\uff1a\u4e0d\u95ee\"\u6211\u7684\u4e1c\u897f\u53bb\u54ea\"\uff0c\u95ee\"**\u8c01\u6d41\u8fdb\u4e86\u6211\uff1f\u5b83\u4e0a\u6b21\u5728\u54ea\uff1f**\"\u2014\u2014\u6cbf\u81ea\u5df1\u7684\u901f\u5ea6**\u5012\u9000**\u4e00\u6b65\uff0c\u53bb\u4e0a\u6e38\u628a\u65e7\u503c\u6284\u56de\u6765\u3002\n\n\u624b\u7b97\u4f8b\uff08dt=0.5 \u79d2\uff09\uff1a\n```\nC \u7684\u58a8\uff1a\u901f\u5ea6 0.2 \u2192 \u5012\u9000 0.1 \u683c \u2192 \u843d\u5728 B\u3001C \u4e4b\u95f4\uff08\u4e00\u6210\u9760 B\u3001\u4e5d\u6210\u9760 C\uff09\n        \u65b0\u58a8 = B \u7684\u58a8 1.0\u00d710% + C \u7684\u58a8 0.1\u00d790% = 0.19  \u2190 \u58a8\u6d8c\u8fdb C \u2713\nB \u7684\u58a8\uff1a\u901f\u5ea6 2.0 \u2192 \u5012\u9000 1 \u683c \u2192 \u6b63\u597d\u843d\u5728 A \u7684\u683c\u5fc3\n        \u65b0\u58a8 = A \u7684\u58a8 0.1  \u2190 \u5927\u58a8\u56e2\u8d70\u4e86 \u2713\n```\n\n- **\u5012\u9000\u6284\u503c = \u7a33\u5b9a\u7684\u6765\u6e90**\uff1a\u6b63\u7740\"\u6492\"\u4f1a\u6492\u4e22\uff08\u8d28\u91cf\u4e0d\u5b88\u6052\u3001\u7206\u6389\uff09\uff0c\u5012\u7740\"\u6284\"\u6c38\u8fdc\u53ea\u662f\u53d6\u4e00\u4e2a\u6570\n- \u5e73\u6d41\u6bcf\u5e27\u4ea7\u51fa\u4e24\u5f20\u65b0\u8868\uff1a\u65b0\u901f\u5ea6\uff08\u98ce\u8fd0\u98ce=\u60ef\u6027\u5ef6\u7eed\uff09+ \u65b0\u58a8\uff08\u58a8\u642d\u98ce\u7684\u8f66\uff09\n- **\u58a8\u81ea\u5df1\u6ca1\u6709\u60ef\u6027**\uff0c\u6709\u60ef\u6027\u7684\u662f\u98ce\uff1b\u60ef\u6027\u8ba4\"\u6b64\u523b\u7684\u901f\u5ea6\"\uff0c\u4e0d\u8ba4\"\u521d\u59cb\u901f\u5ea6\"\uff08\u6eda\u52a8\u60ef\u6027\uff09\n- \u60ef\u6027\u4e0d\u5b58\u50a8\u3001\u6bcf\u5e27\u5b9e\u65f6\u4ece\u573a\u73b0\u8bfb\u73b0\u7528\u2014\u2014\u6240\u4ee5\u5b9e\u65f6\u4ea4\u4e92\u96f6\u5ef6\u8fdf\u3001\u8870\u51cf\u624d\u80fd\u9010\u5e27\u6298\u635f\u5b83\n- \u5e73\u6d41\u4e0d\u95ee\u98ce\u7684\u6765\u5386\uff08\u5feb\u9012\u5458\u4e0d\u7ba1\u5305\u88f9\u4e3a\u4ec0\u4e48\u5bc4\uff09\u2014\u2014\u6709\u98ce\u5c31\u642c\n\n### \u914d\u5e73 vs \u5e73\u6d41\uff1a\u63a8\u6b6a-\u6276\u6b63\u7684\u642d\u6863\n\n```\n\u5e73\u6d41\uff1a\u642c\u5bb6 \u2192 \u9020\u51fa\u65b0\u5dee\u5f02\uff08\u5f04\u4e71\uff09    \u2190 \u5185\u751f\u7684\u4e71\uff08\u5bb6\u91cc\u4eba\u8d70\u52a8\u78b0\u4e71\u4e1c\u897f\uff09\n\u914d\u5e73\uff1a\u89e3\u538b\u529b \u2192 \u71a8\u5e73\uff08\u6574\u7406\uff09        \u2190 \u4fdd\u6d01\u5458\uff0c\u89c1\u4e71\u5c31\u6574\uff0c\u4e0d\u95ee\u8c01\u5f04\u7684\n\u6bcf\u5e27\u5faa\u73af\uff0c\u8c01\u4e5f\u4e0d\u95f2\u7740\n```\n- \u65b0\u5dee\u5f02 \u2260 \u65b0\u7684\u6ce8\u5165\uff08\u5b83\u662f\u5e73\u6d41\u7684\u526f\u4ea7\u54c1\uff0c\u573a\u5185\u90e8\u81ea\u5df1\u957f\u51fa\u6765\u7684\uff09\n- \u65b0\u5dee\u5f02**\u89e3\u51fa**\u65b0\u7684\u538b\u529b\uff08\u5dee\u5f02\u662f\u9898\u76ee\uff0c\u538b\u529b\u662f\u7b54\u6848\u2014\u2014\u4e0d\u662f\"\u5c31\u662f\"\uff09\n- **\u6ce8\u5165\u53ea\u9700\u70b9\u706b\u4e00\u6b21\uff0c\u73af\u9760\"\u5e73\u6d41\u9020\u4e71\u3001\u914d\u5e73\u71a8\u5e73\"\u81ea\u6211\u7ef4\u6301**\n- \u914d\u5e73\u4e0d\u6d88\u8017\u80fd\u91cf\uff08\u91cd\u65b0\u5206\u914d\uff09\uff0c\u8870\u51cf\u624d\u6d88\u8017\uff08\u771f\u5b9e\u6298\u635f\uff09\n- \u914d\u5e73\u7ba1\"\u50cf\u4e0d\u50cf\u6c34\"\uff0c\u8870\u51cf\u7ba1\"\u4ec0\u4e48\u65f6\u5019\u505c\"\n\n### \u8870\u51cf\uff08\u5bff\u547d\uff09\n\n\u6bcf\u5e27 `\u503c /= (1 + \u8870\u51cf\u00d7dt)`\u3002\u70df\u5927\u3001\u58a8 0\u3001\u6c34\u5fae\u5c0f\u3002\u662f\u7f8e\u672f\u53c2\u6570\u4e0d\u662f\u7269\u7406\u3002\n\n---\n\n## \u4e09\u3001\u56e0\u679c\u73af\uff08\u6574\u5957\u7b97\u6cd5\u7684\u4e16\u754c\u89c2\uff09\n\n> **\u5728\u67d0\u4e00\u70b9\u6ce8\u5165\u901f\u5ea6\uff0c\u573a\u4f1a\u5728\u7a7a\u95f4\u4e0a\u4ea7\u751f\u5dee\u5f02\uff1b\u5dee\u5f02\u89e3\u51fa\u538b\u529b\uff0c\u538b\u529b\u5316\u4e3a\u6d41\u52a8\uff0c\u6d41\u52a8\u642c\u8fd0\u4e00\u5207\u3001\u53c8\u5236\u9020\u65b0\u7684\u5dee\u5f02\u2014\u2014\u6d41\u4f53\u7684\u5168\u90e8\u73b0\u8c61\uff0c\u5c31\u662f\u8fd9\u4e2a\u5faa\u73af\u7684\u6301\u7eed\u8fd0\u8f6c\u3002**\n\n```\n\u6ce8\u5165\uff08\u70b9\u706b\uff09\u2192 \u5dee\u5f02\uff08\u51fa\u9898\uff09\u2192 \u538b\u529b\uff08\u89e3\u9898\uff09\u2192 \u4fee\u6b63 \u2192 \u5e73\u6d41\uff08\u60ef\u6027\u642c\u8fd0+\u5f04\u51fa\u65b0\u4e71\uff09\u2192 \u65b0\u5dee\u5f02 \u2192 \u2026\u2026\u5faa\u73af\n```\n\n\u4e09\u79cd\u7ed3\u5c40\uff1a\n| \u60c5\u5f62 | \u7ed3\u5c40 |\n| --- | --- |\n| \u70b9\u706b\u4e00\u6b21 + \u6709\u8870\u51cf | \u80fd\u91cf\u78e8\u5149 \u2192 \u56de\u5230\u5168\u96f6\u7a7a\u8f6c\uff08\u6e56\u9762\u590d\u9759\uff09 |\n| \u70b9\u706b\u4e00\u6b21 + \u65e0\u8870\u51cf | \u8fd1\u4e4e\u6c38\u8f6c |\n| **\u6301\u7eed\u70b9\u706b** | \u6c38\u52a8\uff08\u6cb3\u6d41\u8fdb\u6c34\u53e3\u3001\u706b\u7130\u706b\u6e90\u2014\u2014\u6bcf\u5e27\u6ce8\u5165\uff09 |\n\n\u5168\u96f6\u65f6\u5faa\u73af\u7167\u8f6c\uff0c\u53ea\u662f\u7a7a\u8f6c\uff08\u5e73\u6d41=\u6bcf\u683c\u6284\u81ea\u5df1\uff09\u3002**\u5faa\u73af\u4e00\u76f4\u5728\u8f6c\uff0c\u6ce8\u5165\u51b3\u5b9a\u5b83\u7a7a\u8f6c\u8fd8\u662f\u5b9e\u8f6c\u3002**\n\n\u7c7b\u6bd4\uff08\u6e56\u4e0e\u6cb3\uff09\uff1a\u6e56\u9762\u9759=\u8d26\u5e73\uff1b\u9ad8\u4f4e\u843d\u5dee=\u5dee\u5f02\uff1b\u6c34\u5f80\u4f4e\u5904\u6d41=\u538b\u529b\u9a71\u52a8\uff1b\u4e0a\u6e38\u6765\u6c34=\u6ce8\u5165\uff1b\u538b\u529b\u91ca\u653e\u53e3=outflow\u3002\u6d45\u6c34\u65b9\u7a0b\u6a21\u578b\u751a\u81f3\u76f4\u63a5\u62ff\"\u6c34\u9762\u9ad8\u5ea6\"\u5f53\u538b\u529b\u3002\n\n---\n\n## \u56db\u3001\u7eb3\u7ef4-\u65af\u6258\u514b\u65af\u65b9\u7a0b\uff08\u7b26\u53f7\u8868 + \u4e2d\u6587\u6ce8\u89e3\u7248\uff09\n\n```\n\u2202u/\u2202t = \u2212(u\u00b7\u2207)u \u2212 (1/\u03c1)\u2207p + \u03bd\u2207\u00b2u + f\n\u2207\u00b7u = 0\n```\n\n| \u7b26\u53f7 | \u8bfb\u6cd5 | \u610f\u601d | \u5bf9\u5e94\u6982\u5ff5 |\n| --- | --- | --- | --- |\n| \u2202u/\u2202t | u \u5bf9 t \u7684\u504f\u5bfc | \u901f\u5ea6\u968f\u65f6\u95f4\u7684\u53d8\u5316 | \u8fd9\u4e00\u5e27\u901f\u5ea6\u600e\u4e48\u53d8 |\n| u | \u901f\u5ea6\u573a | \u6bcf\u683c\u7684\u7bad\u5934 | \u98ce |\n| \u2207 | nabla | \u68af\u5ea6\u7b97\u5b50(\u2202/\u2202x, \u2202/\u2202y) | \u5dee\u5f02\u63a2\u9488 |\n| \u2212(u\u00b7\u2207)u | \u5e73\u6d41\u9879 | \u98ce\u8fd0\u98ce | **\u5e73\u6d41\uff08\u60ef\u6027\uff09** |\n| (1/\u03c1)\u2207p | \u538b\u529b\u9879 | \u538b\u529b\u5dee\u63a8\u52a8 | **\u914d\u5e73\u4ea7\u751f\u7684\u6d41\u52a8** |\n| \u03c1 | rho | \u5bc6\u5ea6\uff08\u5e38\u6570\uff09 | \u6bd4\u4f8b\u7cfb\u6570 |\n| \u2207\u00b2 | \u62c9\u666e\u62c9\u65af | \u548c\u90bb\u5c45\u5e73\u5747\u5dee\u591a\u5c11\uff08\u62b9\u5e73\u503e\u5411\uff09 | \u62b9\u5e73\u5668 |\n| \u03bd | nu | \u8fd0\u52a8\u7c98\u5ea6 | \uff08\u6e38\u620f\u6254\u6389\u6b64\u9879\uff0c\u6570\u503c\u8017\u6563\u514d\u8d39\u9001\uff09 |\n| f | \u5916\u529b | \u5916\u754c\u52a0\u7684\u529b | **\u6ce8\u5165** |\n\n### \u4e2d\u6587\u6ce8\u89e3\u7248\uff08\u4e00\u884c\u80cc\u4e0b\u6765\uff09\n\n> **\u901f\u5ea6\u7684\u53d8\u5316 \uff1d \u98ce\u642c\u8d70\u81ea\u5df1\uff08\u60ef\u6027\uff09 \u2212 \u538b\u529b\u5dee\u7684\u63a8\u52a8 \uff0b \u7c98\u6027\u62b9\u5e73\uff08\u6254\u6389\uff09 \uff0b \u5916\u529b\u6ce8\u5165**\n\n\u914d\u5957\u65b9\u7a0b\uff1a**\u2207\u00b7u = 0 \u2192 \u6bcf\u4e00\u683c\u6563\u5f00\u7684\u7a0b\u5ea6\u4e3a\u96f6\uff08\u6ca1\u6709\u6cc9\u773c\u3001\u6ca1\u6709\u4e0b\u6c34\u9053\uff0c\u53ea\u6709\u6cb3\u9053\uff09**\n\n### \u5206\u9879\u4e2d\u6587\u5bf9\u7167\n\n| \u4e2d\u6587\u8eab\u4efd | \u539f\u5f0f | \u767d\u8bdd |\n| --- | --- | --- |\n| **\u901f\u5ea6\u7684\u53d8\u5316** | \u2202u/\u2202t | \u7b49\u53f7\u5de6\u8fb9\uff1a\u8fd9\u4e00\u5e27\u98ce\u8981\u600e\u4e48\u53d8 |\n| \uff1d **\u98ce\u642c\u8d70\u81ea\u5df1** | \u2212(u\u00b7\u2207)u | \u987a\u7740\u98ce\u7684\u65b9\u5411\uff0c\u98ce\u628a\u81ea\u5df1\u642c\u8d70\uff08\u5e73\u6d41=\u60ef\u6027\uff09 |\n| \u2212 **\u538b\u529b\u5dee\u7684\u63a8\u52a8** | (1/\u03c1)\u2207p | \u6324\u7684\u5730\u65b9\u5f80\u677e\u7684\u5730\u65b9\u63a8\uff08\u914d\u5e73\u4ea7\u751f\u7684\u6d41\u52a8\uff09 |\n| \uff0b **\u7c98\u6027\u62b9\u5e73** | \u03bd\u2207\u00b2u | \u548c\u90bb\u5c45\u5e73\u5747\u5dee\u591a\u5c11\u5c31\u62b9\u5e73\u591a\u5c11\uff08\u6e38\u620f\u6254\u6389\uff09 |\n| \uff0b **\u5916\u529b\u6ce8\u5165** | f | \u4f60\u7684\u624b\u3001\u6d6e\u529b\u3001\u8fdb\u6c34\u53e3\u3001\u6da1\u5ea6\u7ea6\u675f\u7684\u8865\u529b\uff08\u6240\u6709\u5916\u6765\u7684\u529b\u4f4f\u8fd9\uff09 |\n\n### \u7b26\u53f7\u7ea7\u5b8c\u5168\u7ffb\u8bd1\n\n```text\n\u3010\u901f\u5ea6\u3011\u7684\u3010\u968f\u65f6\u95f4\u53d8\u5316\u3011\n \uff1d \u3010\u6cbf\u81ea\u5df1\u65b9\u5411\u3011\u628a\u3010\u901f\u5ea6\u3011\u642c\u8d70\n \u2212 \u3010\u538b\u529b\u3011\u7684\u3010\u7a7a\u95f4\u5dee\u3011\u00f7\u3010\u5bc6\u5ea6\u3011\n \uff0b \u3010\u7c98\u5ea6\u3011\u00d7\u3010\u548c\u90bb\u5c45\u7684\u5e73\u5747\u5dee\u3011\n \uff0b \u3010\u5916\u529b\u3011\n```\n\n### \u516c\u5f0f\u9879 \u2194 \u6e38\u620f\u5b9e\u73b0\uff08\u5168\u90e8\u624b\u7b97\u8fc7\uff09\n\n| \u516c\u5f0f\u9879 | \u6e38\u620f\u6b65\u9aa4 | \u624b\u7b97\u5bf9\u5e94 |\n| --- | --- | --- |\n| f | \u2460 \u6ce8\u5165 | \u4e09\u683c\u5206\u529b\u6298\u6263\u8868 |\n| (1/\u03c1)\u2207p + \u2207\u00b7u=0 | \u2462\u2463\u2464 \u914d\u5e73 | B \u4e8f 1.8 \u7684\u8d26 + \u538b\u529b\u8fed\u4ee3 |\n| \u2212(u\u00b7\u2207)u | \u2465 \u5e73\u6d41 | \u5012\u9000\u6284\u503c\uff08C \u6284\u5230 0.19\uff09 |\n| \u03bd\u2207\u00b2u | \u6254\u6389\uff08\u2466\u8870\u51cf\u662f\u7f8e\u672f\u66ff\u8eab\uff09 | \u2014\u2014 |\n\n\u767d\u8bdd\uff1a**\u901f\u5ea6\u7684\u53d8\u5316 = \u60ef\u6027\u642c\u8fd0 + \u538b\u529b\u63a8\u52a8 + \u7c98\u6027\u62b9\u5e73(\u6254) + \u5916\u529b\u6ce8\u5165\u3002**\n\n\uff08\u5b8c\u6574\u516c\u5f0f\u7248\u7b97\u6cd5 + \u6bcf\u6b65\u79bb\u6563\u516c\u5f0f\u89c1\u5bf9\u8bdd\u672b\u5c3e / \u6559\u5b66\u9875\u9644\u5f55\u3002\uff09\n\n---\n\n## \u4e94\u3001\u6da1\u6d41\uff08\u5df2\u5b8c\u6574\u5b66\u5b8c \u2705\uff09\n\n### \u6da1\u662f\u4ec0\u4e48\uff1a\u683c\u5b50\u91cc\u7684\u6c34\u539f\u5730\u6253\u8f6c\n\n**\u6d4b\u91cf\u5de5\u5177\uff1a\u60f3\u8c61\u653e\u4e00\u4e2a\u5c0f\u6868\u8f6e\uff08\u5341\u5b57\u53f6\u7247\uff09\u5728\u683c\u5b50\u91cc\uff0c\u770b\u5b83\u8f6c\u4e0d\u8f6c\u3001\u5f80\u54ea\u8f6c\u3001\u8f6c\u591a\u5feb\u3002**\n\n\u65cb\u8f6c\u573a\u7684\u5e03\u7f6e\uff08\u987a\u65f6\u9488\uff09\uff1a\n```\n\u4e0a\u90bb \u2192(+1,0)   \u53f3\u90bb \u2193(0,\u22121)\n\u5de6\u90bb \u2191(0,+1)   \u4e0b\u90bb \u2190(\u22121,0)\n```\n\n**\u6da1\u5ea6\u516c\u5f0f\uff08\u5168\u662f\u51cf\u6cd5/\u5dee\u5206\uff09\uff1a**\n```\n\u6da1\u5ea6 =\uff08\u53f3\u7684\u7ad6\u76f4 \u2212 \u5de6\u7684\u7ad6\u76f4\uff09\u2212\uff08\u4e0a\u7684\u6c34\u5e73 \u2212 \u4e0b\u7684\u6c34\u5e73\uff09\n\u624b\u7b97\uff1a=(\u22121\u22121)\u2212(1\u2212(\u22121)) = \u22124  \u2192 \u8d1f=\u987a\u65f6\u9488\uff0c\u7edd\u5bf9\u503c=\u5f3a\u5ea6\n```\n\u5bf9\u7167\uff08\u9f50\u6b65\u6d41\uff0c\u5168\u5f80\u4e1c\uff09\uff1a=(0\u22120)\u2212(1\u22121)=0 \u2192 \u76f4\u6d41\u65e0\u6da1\u3002**\u8fd9\u5c31\u662f\"\u6d41\u52a8\"\u548c\"\u65cb\u8f6c\"\u7684\u6570\u5b66\u5206\u754c\u7ebf\u3002**\n\n### \u6da1\u7684\u51fa\u751f\uff1a\u526a\u5207\u6413\u7684\n\n- **\u526a\u5207**\uff1a\u76f8\u90bb\u4e24\u5c42\u4ee5\u4e0d\u540c\u901f\u5ea6\u6ed1\u52a8\u3001\u9519\u5f00\uff08\u8bcd\u6e90=\u526a\u5200\u4e24\u5200\u7247\u9519\u52a8\uff09\u3002\u753b\u9762\uff1a\u63a8\u4e00\u53e0\u6251\u514b\u724c\uff0c\u4e0a\u5c42\u5feb\u4e0b\u5c42\u6162\uff0c\u5c42\u95f4\u9519\u5f00\u3002\n- **\u51c6\u786e\u65b9\u5411\u5173\u7cfb**\uff1a\u526a\u5207 = \u901f\u5ea6\u5dee\u51fa\u73b0\u5728**\u5782\u76f4\u4e8e\u6d41\u52a8\u65b9\u5411**\u4e0a\uff08\u5e76\u6392\u4e24\u80a1\u4e00\u5feb\u4e00\u6162\uff09\uff1b\u901f\u5ea6\u5dee\u51fa\u73b0\u5728**\u6cbf\u6d41\u52a8\u65b9\u5411**\uff08\u524d\u540e\u5feb\u6162\uff09= \u6563\u5ea6\uff08\u62c9\u4f38/\u6cc9\u773c\uff09\u3002\n- **\u65cf\u8c31**\uff1a\u901f\u5ea6\u5dee\uff08\u7a7a\u95f4\u4e0d\u5747\u5300\uff09\u2192 \u2460\u7eb5\u5411\uff08\u540c\u5411\u4e0d\u5747\uff09\u2192\u6563\u5ea6\u2192\u538b\u529b\u7ba1\u8d26\uff1b\u2461\u6a2a\u5411\uff08\u526a\u5207\uff09\u2192\u6da1\u5ea6\u2192\u6da1\u3002\n- \u62d6\u52a8\u51fa\u6da1\uff1a\u624b\u6307\u8def\u5f84=\u5feb\u5e26\uff0c\u4e24\u4fa7\u6162\u6c34 \u2192 \u4e0a\u4e0b\u4e24\u6761**\u526a\u5207\u7ebf** \u2192 \u6da1\u51fa\u751f\u5728\u526a\u5207\u7ebf\u4e0a\uff08\u4e0d\u5728\u8def\u5f84\u4e2d\u592e\uff09\uff0c\u4e24\u6392\u8f6c\u5411\u76f8\u53cd\u3002\u753b\u5708=\u5feb\u5e26\u9996\u5c3e\u76f8\u8fde\u5168\u540c\u5411\u6413 \u2192 \u5408\u6210\u5927\u6da1\u3002\n\n### \u6da1\u600e\u4e48\u88ab\u770b\u89c1\uff1a\u58a8\u642d\u8f66\u663e\u5f71\n\n\u58a8\u6ca1\u6709\u817f\uff0c\u6bcf\u5e27\u642d\u5f53\u5730\u98ce\u7684\u8f66\uff1b\u65cb\u8f6c\u573a\u7684\u98ce**\u65b9\u5411\u4e00\u76f4\u5728\u53d8** \u2192 \u58a8\u88ab\u63b0\u5f2f\u8d70\u51fa\u5706\u5708\u3002**\u4e00\u56e2\u58a8**\u56e0\u5185\u5916\u4fa7\u6bcf\u5e27\u88ab\u5e26\u65b9\u5411\u7565\u6709\u5dee\u5f02 \u2192 \u88ab\u62c9\u6210\u957f\u6761 \u2192 \u5377\u6210\u87ba\u65cb\u4e1d\u3002\u6ca1\u4eba\u753b\u87ba\u65cb\uff0c\u87ba\u65cb\u662f\u642c\u8fd0\u7684\u526f\u4ea7\u54c1\u3002\uff08= \u6405\u5496\u5561\u5976\u6cab\u5377\u51fa\u65cb\u6da1\u82b1\u7eb9\u3002\uff09\n\n### \u6da1\u7684\u4e00\u751f\n\n```\n\u51fa\u751f\uff08\u526a\u5207\u6413\uff09\u2192 \u6210\u5f62\uff08\u5e73\u6d41\u642c\u8fd0\u62c9\u4f38\u5377\u7d27\uff09\u2192 \u7ef4\u6301\uff08\u60ef\u6027\uff1a\u6da1\u662f\u901f\u5ea6\u573a\u7684\u5f62\u72b6\uff0c\n\u81ea\u5df1\u642c\u8fd0\u81ea\u5df1\uff09\u2192 \u8870\u8001\uff08\u4e24\u79cd\u6469\u64e6\uff1a\u8870\u51cf\u6298\u635f + \u63d2\u503c\u6a21\u7cca\u4e13\u78e8\u5c0f\u5c3a\u5ea6\uff09\n\u2192 \u6b7b\u4ea1\uff08\u80fd\u91cf\u8017\u5c3d\uff09\u2192 \u7eed\u547d\uff08\u6da1\u5ea6\u7ea6\u675f\uff0c\u89c1\u4e0b\uff09\n```\n\n### \u6da1\u5ea6\u7ea6\u675f\uff08\u7eed\u547d\u836f \u00b7 \u975e\u7269\u7406\u8865\u4e01\uff09\n\n- **\u516c\u5f0f**\uff1a\u8865\u529b = \u03b5\u00b7(\u2207|\u03c9| \u00d7 \u03c9)\u2014\u2014\u7528**\u53c9\u79ef**\uff08\u4e0d\u662f\u70b9\u4e58\uff01\u53c9\u79ef\u5929\u751f\u7ed9\u51fa\u5782\u76f4\u65b9\u5411=\u65cb\u8f6c\u5207\u7ebf\u65b9\u5411\uff09\u6cbf\"\u66f4\u5f3a\u6da1\"\u7684\u65b9\u5411\u7ed9\u5207\u5411\u8865\u529b\u3002\n- **\u7b97\u6cd5\u8eab\u4efd**\uff1a\u4e0d\u5728\u539f\u7248\u65b9\u7a0b\u91cc\uff1b\u5b9e\u73b0\u4e3a **f \u7684\u4e00\u9879**\uff08f \u603b = \u4f60\u7684\u6ce8\u5165 + \u6da1\u5ea6\u8865\u529b\uff09\uff0c\u4f4d\u7f6e\u5728\u2460\u6ce8\u5165\u4e4b\u540e\u2462\u914d\u5e73\u4e4b\u524d\uff08\u6240\u6709\u6539\u901f\u5ea6\u7684\u6b65\u9aa4\u90fd\u8981\u5728\u914d\u5e73\u524d\u5b8c\u6210\uff09\u3002\n- **Niagara \u91cc**\uff1aApply Forces \u9636\u6bb5\u7684\u4e00\u4e2a\u6a21\u5757\uff0c**\u6bcf\u5e27\u4e00\u6b21**\uff08\u5e27\u5faa\u73af\uff09\uff0c\u4e0d\u50cf\u538b\u529b\u90a3\u6837\u5e27\u5185\u8fed\u4ee3 N \u6b21\u2014\u2014\u5b83\u662f\u663e\u5f0f\u5f00\u836f\u65b9\uff0c\u4e0d\u7528\u903c\u8fd1\u3002\n- **\u7eed\u8d39\u4e0d\u662f\u507f\u8fd8**\uff1a\u8865\u529b \u221d \u5f53\u524d\u6da1\u5ea6\uff08\u6b63\u53cd\u9988\uff1a\u5f3a\u2192\u591a\u8865\u2192\u66f4\u5f3a\uff09\uff0c\u4e0d\u662f\"\u8865\u56de\u8870\u51cf\u6389\u7684\u91cf\"\u3002\u6b63\u53cd\u9988 = \u7075\u4e4b\u5904\uff0c\u4e5f\u662f\"\u8fc7\u54b8\"\uff08\u6ed1\u5757 50 \u75c5\u6001\u81ea\u589e\u5f3a\uff09\u7684\u539f\u56e0\u3002\n- **\u53ea\u80fd\u6276\u4e0d\u80fd\u751f**\uff1a\u753b\u9762\u9759\u6b62\u65f6\u5b83\u65e0\u4e8b\u53ef\u505a\uff1b\u9020\u6da1\u6c38\u8fdc\u9760\u6ce8\u5165\u5236\u9020\u526a\u5207\u3002\n- **\u6ed1\u5757\u624b\u611f**\uff1a0~5 \u8702\u871c\u7194\u5ca9 / 15~25 \u70df\u7684\u81ea\u7136\u533a\u95f4 / 30~40 \u6e4d\u6d41\u566a\u6ce2 / 50 \u8fc7\u54b8\u3002\n\n### \u80fd\u91cf\u7ea7\u8054\uff08\u5c0f\u5f3a\u5ea6\u4e24\u4e2a\u5927\u6da1 vs \u5927\u5f3a\u5ea6\u6ee1\u5c4f\u566a\u6ce2\uff09\n\n- \u5c0f\u5f3a\u5ea6\uff1a\u6570\u503c\u78e8\u8017\u50cf\u7b5b\u5b50\u78e8\u6389\u5c0f\u6da1\uff0c\u53ea\u5269\u5927\u6da1\uff08\u4e00\u4e24\u4e2a\u4f18\u96c5\u65cb\u6da1\uff09\uff1b\n- \u5927\u5f3a\u5ea6\uff1a\u2460\u7b5b\u5b50\u5931\u6548\u5c0f\u6da1\u5168\u6d3b \u2461**\u5927\u6da1\u8fb9\u7f18\u672c\u8eab\u5c31\u662f\u526a\u5207\u7ebf**\u2192\u6413\u51fa\u65b0\u5c0f\u6da1\u2192\u5c0f\u6da1\u8fb9\u7f18\u53c8\u6413\u66f4\u5c0f\u7684\u2026\u2026\u80fd\u91cf\u4ece\u5927\u5c3a\u5ea6\u4f20\u5411\u5c0f\u5c3a\u5ea6\uff08\u7ea7\u8054\u5168\u5f00\uff09\u2462\u7ea6\u675f\u672c\u8eab\u6ce8\u80fd\u8fc7\u91cf\uff1b\n- \u566a\u6ce2\u611f = \u5c0f\u5c3a\u5ea6+\u9ad8\u5bc6\u5ea6+\u968f\u673a+\u957f\u5bff\u3002\n\n### \u6f14\u793a 3-1 \u65b0\u589e\u89c2\u5bdf\u5de5\u5177\uff08\u5df2\u4e0a\u4f20\uff09\n\n\u6162\u653e\u6ed1\u5757\uff080.05\u00d7~1\u00d7\uff09/ \u6682\u505c/\u7ee7\u7eed / \u5355\u6b65+1\u5e27 / \u6e05\u7a7a\u2014\u2014\u9010\u5e27\u770b\u6da1\u7684\u751f\u706d\u3002\n\u63a8\u8350\u6d41\u7a0b\uff1a\u6162\u653e 0.2\u00d7 + \u6e05\u7a7a \u2192 \u6ed1\u5757 0 \u753b\u5708\u5355\u6b65\u770b\u81ea\u7136\u5bff\u547d \u2192 \u6ed1\u5757 40 \u518d\u753b\u5708\u770b\u7eed\u547d\u3002\n\n### \u5f85\u5b66\uff08\u4e0b\u6b21\u4ece\u8fd9\u91cc\u7ee7\u7eed\uff09\n\n- **\u5361\u95e8\u6da1\u8857**\uff1a\u6cb3\u6d41\u6f14\u793a 6-2 \u77f3\u5934\u80cc\u540e\u2014\u2014\u526a\u5207\u5c42\u5929\u751f\u4e0d\u7a33\u5b9a\uff08\u5f00\u5c14\u6587-\u4ea5\u59c6\u970d\u5179\u4e0d\u7a33\u5b9a\u6027\uff09\uff0c\u81ea\u52a8\u5377\u6210\u4e00\u4e2a\u4e2a\u6da1\u3001\u5468\u671f\u6027\u8131\u843d\u6392\u6210\u4e24\u6392\n- \u03c9 \u7684\u5b8c\u6574\u4e2d\u6587\u5316\uff08\u6da1\u5ea6\u4e0d\u5728\u4e3b\u65b9\u7a0b\u91cc\uff0c\u662f\u6da1\u5ea6\u7ea6\u675f\u7684\u79c1\u8d27\uff09\n\n---\n\n## \u516d\u3001Niagara \u76f8\u5173\n\n- **Grid 2D \u4e00\u5e27**\uff1aSimulation Stages \u4f9d\u6b21 = \u6ce8\u5165(Source/Set Grid Values) \u2192 \u5916\u529b(Apply Forces) \u2192 \u6563\u5ea6(Divergence) \u2192 \u538b\u529b(Pressure\uff0cNum Iterations \u53c2\u6570\u5728\u8fd9) \u2192 \u68af\u5ea6 \u2192 \u5e73\u6d41(Advect) \u2192 \u8f93\u51fa(Render Parameters)\n- **\u6750\u8d28 vs \u84dd\u56fe**\uff1a\u6a21\u62df\u5728 Simulation Stages\uff08\u7b97\uff09\uff1b\u6750\u8d28\u91c7\u6837\u8f93\u51fa RT\uff08\u753b\uff09\uff1b\u84dd\u56fe\u53ea\u5728\u6e38\u620f\u903b\u8f91\u65f6\u8fdb\u573a\uff08\u4f20\u73a9\u5bb6\u4f4d\u7f6e\u3001\u89e6\u53d1\u4e8b\u4ef6\uff09\u3002Niagara\u2192\u6750\u8d28\u7ecf User Parameters \u76f4\u8fde\uff0c\u65e0\u84dd\u56fe\n- **\u573a\u7684\u521d\u59cb\u5316**\uff1aSpawn \u65f6\u5206\u914d\u7eb9\u7406\u6e05\u96f6\uff08\u4e70\u7a7a\u8d26\u672c\uff09\uff0c\u5185\u5bb9\u6bcf\u5e27\u6eda\u52a8\u91cd\u5199\uff1b\u80fd\u9884\u5199\u7684\u53ea\u6709\u70d8\u7119 Vector Field\uff08\u53e6\u4e00\u6761\u8def\uff09\n- **\u7eaf\u6750\u8d28\u6d41\u4f53**\uff1a\u6750\u8d28\u65e0\u72b6\u6001\u2192\u53ea\u80fd\u4f2a\u9020\uff08flow map/panner\uff09\uff1b\u6750\u8d28+RT \u4e52\u4e53\u53ef\u8dd1\u771f\u6a21\u62df\u4f46\u6bcf\u5e27 1 pass\uff08\u505a\u4e0d\u4e86\u5b8c\u6574\u538b\u529b\u8fed\u4ee3\uff09\uff1bNinja/Niagara = \u6bcf\u5e27\u5341\u51e0\u4e2a pass \u7684\u539f\u751f\u8c03\u5ea6\n- **Curl Noise**\uff08\u5df2\u5355\u72ec\u6574\u7406\u8fdb Obsidian \u7b14\u8bb0\uff09\uff1a\u52bf\u51fd\u6570\u53d6\u65cb\u5ea6\u2192\u6570\u5b66\u4fdd\u8bc1\u65e0\u6563\uff1b\u7b49\u9ad8\u7ebf\u6bd4\u55b
